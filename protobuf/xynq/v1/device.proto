syntax = "proto3";

package xynq.v1;

message DeviceState {
  BatteryState battery = 1;
  SoundState sound = 2;
  MediaState media = 3;
}

message BatteryState {
  uint32 level = 1;
  bool is_charging = 2;
}

message SoundState {
  uint32 volume = 1;
  bool is_muted = 2;
}

message MediaState {
  string title = 1;
  string app_name = 2;
  bool is_playing = 3;
}

message DeviceEvent {
  oneof kind {
    BatteryState battery_state_changed = 1;
    SoundState sound_state_changed = 2;
    MediaState media_state_changed = 3;

    string clipboard_text_copied = 4;
    bytes clipboard_image_copied = 5;
  }
}

message DeviceCommand {
  oneof kind {
    SoundState sound_update_state = 1;

    MediaPlayPause media_play_pause = 2;
    MediaNext media_next = 3;
    MediaPrevious media_previous = 4;
  }
}

message MediaPlayPause {}

message MediaNext {}

message MediaPrevious {}
